# Release: Changesets v3 + npm trusted publishing (OIDC).
#
#   push to main/next ─▶ select-mode ─┬─ mode=version ─▶ version  (opens/updates "Version Packages" PR)
#                                     └─ mode=publish ─▶ pack ─▶ publish (npm + git tags + GitHub releases)
#   manual run with canary=true ─▶ canary (snapshot <next>-canary-<datetime> under the npm tag `canary`;
#                                          no git tag, no release; products install eharness@canary)
#
# The npm trusted publisher MUST be configured for this exact file name: release.yml
# and environment: npm. Docs: docs/engineering/release.md
#
# Only GITHUB_TOKEN is used: no GitHub App, PAT or npm token. CI on the version PR (opened with
# GITHUB_TOKEN) waits for a maintainer to click "Approve workflows to run" (release.md §5).
name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      canary:
        description: Publish a canary snapshot of the pending changesets (npm tag `canary`)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  select-mode:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next') && inputs.canary != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: select-mode

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: bun run release:version # changeset version, sync src/index.ts version, lockfile
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          # read by @changesets/changelog-github while generating CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun run check:package
      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm # must match the environment in the npm trusted publisher config
    permissions:
      contents: write # git tags + GitHub releases
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.21.0 && npm --version
      # @changesets/cli is needed by the publish sub-action; no lifecycle scripts while holding id-token
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.canary == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm # same trusted publisher as the release jobs
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.21.0 && npm --version
      - run: bun install --frozen-lockfile
      - run: bun test
      # snapshot version from the pending changesets (no commit, no tag)
      - run: bunx changeset version --snapshot canary && bun scripts/sync-version.ts
      - run: bun run build
      - run: bun run check:package
      - run: bunx changeset publish --tag canary --no-git-tag
