# CI: lint, typecheck, test, build, package checks, changeset check, Node compatibility.
# Docs: docs/engineering/release.md §6
name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for examples/postgres-storage.ts (its tests skip without DATABASE_URL).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: eharness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status needs the base branch
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test # includes examples/examples.test.ts (offline, scripted models)
        env:
          DATABASE_URL: postgres://postgres:eharness@localhost:5432/postgres
      - run: bun run build
      - run: bun run check:package # publint + attw
      - run: bun run check:imports # subpath modules import core only via src/index.ts

      - name: Require a changeset for user-facing changes
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'dependabot/')
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  # Peer-range compatibility (P1-4/P1-15). `latest` catches upstream renames of the experimental AI
  # SDK options we rely on (docs/engineering/api-stability.md §experimental dependencies); `lowest`
  # runs the oldest supported zod. Dependencies are overridden after the frozen install, nothing is
  # committed.
  compat:
    name: Peers · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai@latest + @ai-sdk/mcp@latest
            packages: ai@latest @ai-sdk/mcp@latest
          - name: zod@3.25.76 (lowest supported)
            packages: zod@3.25.76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - name: Override peers
        run: bun add --no-save ${{ matrix.packages }}
      - run: bun run typecheck
      - run: bun test src

  # The team example's own checks that `bun test` at the root does not cover: the web tests run
  # standalone (as a developer runs them) and the two real-process scripts (SIGKILL / restart and
  # two instances on one SQLite file). Ports are picked by the OS, the database lives in a temp dir
  # and every script has an overall limit that also kills the servers it started.
  team:
    name: Team example · web tests · real-process scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Web tests (standalone)
        working-directory: examples/team/web
        timeout-minutes: 3
        run: bun test

      - name: Two instances on one database (real processes)
        timeout-minutes: 6
        run: bun run --cwd examples/team test:instances
        env:
          SCRIPT_TIMEOUT_MS: '300000'

      - name: SIGKILL and restart (real processes)
        timeout-minutes: 6
        run: bun run --cwd examples/team test:restart
        env:
          SCRIPT_TIMEOUT_MS: '300000'

  node-compat:
    name: Node ${{ matrix.node }} · packed tarball smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball in a clean Node project and import every entry point
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/eharness-*.tgz ai@^7.0.127 zod@^4 @ai-sdk/mcp@^2.0.66
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs"

      - name: eharness/mcp without the optional peer gives a clear error
        run: |
          mkdir "$RUNNER_TEMP/smoke-nomcp"
          cd "$RUNNER_TEMP/smoke-nomcp"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/eharness-*.tgz ai@^7.0.127 zod@^4
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs" --no-mcp
