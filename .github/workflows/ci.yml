# CI: lint, typecheck, test, build, package checks, changeset check, Node compatibility.
# Docs: docs/engineering/release.md §6
name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset status needs the base branch
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # version from package.json "packageManager"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run check:package # publint + attw
      - run: bun run check:imports # subpath modules import core only via src/index.ts

      - name: Require a changeset for user-facing changes
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'dependabot/')
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  node-compat:
    name: Node ${{ matrix.node }} · packed tarball smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball in a clean Node project and import every entry point
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/eharness-*.tgz ai@^7 zod@^4 @ai-sdk/mcp@^2
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs"

      - name: eharness/mcp without the optional peer gives a clear error
        run: |
          mkdir "$RUNNER_TEMP/smoke-nomcp"
          cd "$RUNNER_TEMP/smoke-nomcp"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/eharness-*.tgz ai@^7 zod@^4
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs" --no-mcp
