version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # ai / zod / @ai-sdk/mcp are peer dependencies: major bumps are deliberate releases
    # (docs/engineering/api-stability.md), so let humans handle them.
    ignore:
      - dependency-name: ai
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: '@ai-sdk/mcp'
        update-types: ['version-update:semver-major']
